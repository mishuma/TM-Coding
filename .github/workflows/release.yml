# Builds tm-image-app-starter.zip, runs the end-to-end tests against the unzipped package,
# and attaches it to a GitHub Release.
#
# To publish:   git tag v1.0.0 && git push origin v1.0.0
# Teachers then download: https://github.com/<owner>/<repo>/releases/latest/download/tm-image-app-starter.zip
#
# Running it from the Actions tab ("Run workflow") builds and tests the zip and uploads it as a
# workflow artifact, without creating a release.
name: Release starter kit

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Build zip
        run: python scripts/package.py

      - name: Test the unzipped package (what students actually get)
        run: |
          mkdir -p "$RUNNER_TEMP/kit"
          unzip -q dist/tm-image-app-starter.zip -d "$RUNNER_TEMP/kit"
          KIT="$RUNNER_TEMP/kit" python tests/run_tests.py

      - uses: actions/upload-artifact@v4
        with:
          name: tm-image-app-starter
          path: dist/tm-image-app-starter.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/tm-image-app-starter.zip \
            --title "Starter kit $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/tm-image-app-starter.zip --clobber
